[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srno"
version = "0.1.0"
description = "Shared resolvent neural operator for quasistatic parallel-jaw contact dynamics"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.7,<3",
  "numpy>=1.26,<3",
  "h5py>=3.10,<4",
  "trimesh>=4.5,<5",
  "yourdfpy>=0.0.60,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
train = ["tensorboard>=2.20,<3"]

[project.scripts]
srno = "srno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

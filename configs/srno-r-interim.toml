seed = 0
device = "cuda"

[paths]
manifest = "../data/simulator-r-interim-v1/manifest.json"
active_index = "../data/simulator-r-interim-v1/active-index.npz"
output_dir = "../runs/srno-r-interim-11objects"

[model]
hidden_dim = 64

[loss]
lambda_rotation = 1.0
lambda_joints = 1.0
lambda_feasibility = 1.0
# Raw cooked-collision SDF boundary calibrated on train+val GT actual-joint FK
# (lower 0.5% quantile). The 2.56 mm PhysX contact envelope is not included.
admissible_gap_m = -0.000512322352733463

[optimizer]
learning_rate = 3e-4
weight_decay = 1e-4
gradient_clip = 1.0
warmup_fraction = 0.05

[loader]
objects_per_batch = 4
local_samples_per_object = 256
rollout_trajectories_per_object = 8
workers = 4

[training]
local_epochs = 100
rollout_epochs_per_horizon = 25
rollout_horizons = [4, 8, 16, 32]
early_stopping_patience = 10
use_bfloat16 = true

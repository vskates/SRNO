seed = 0
device = "cuda"

[paths]
manifest = "/home/weshi/SRNO/data/simulator-r-v1/manifest.json"
active_index = "/home/weshi/SRNO/data/simulator-r-v1/active-index.npz"
output_dir = "/home/weshi/SRNO/runs/ablation-local-trust-region/seed-0"

[model]
hidden_dim = 64
contact_features = "gap"
global_conditioning = "aperture"

[loss]
lambda_rotation = 1.0
lambda_joints = 1.0
lambda_feasibility = 1.0
admissible_gap_m = -0.00049232522724196315

[optimizer]
learning_rate = 3e-4
weight_decay = 1e-4
gradient_clip = 1.0
warmup_fraction = 0.05

[loader]
objects_per_batch = 4
local_samples_per_object = 256
rollout_trajectories_per_object = 8
workers = 4

[training]
local_epochs = 100
rollout_epochs_per_horizon = 25
rollout_horizons = [4, 8, 16, 32]
early_stopping_patience = 10
use_bfloat16 = true

[trust_region]
# Frozen before any test evaluation: material-v2 simulator repeatability floor.
epsilon_dx = 0.002991000423207879
# Zero selects rho = 1 / epsilon_dx^2, which makes the constraint gradient
# scale-aware without tuning a trade-off on validation or test metrics.
rho = 0.0
reference_cache = "/home/weshi/SRNO/runs/ablation-local-trust-region/seed-0/frozen-local-reference.pt"

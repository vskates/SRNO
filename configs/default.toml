seed = 0
device = "cuda"

[paths]
manifest = "../data/simulator-v1/manifest.json"
active_index = "../data/simulator-v1/active-index.npz"
output_dir = "../runs/srno-contact-v1-full-coverage"

[model]
hidden_dim = 64

[loss]
lambda_rotation = 1.0
lambda_aperture = 1.0
lambda_feasibility = 1.0

[optimizer]
learning_rate = 3e-4
weight_decay = 1e-4
gradient_clip = 1.0
warmup_fraction = 0.05

[loader]
objects_per_batch = 4
# These are minibatch chunk sizes, not per-epoch sample caps. The coverage
# sampler visits every active transition / trajectory exactly once per epoch.
local_samples_per_object = 256
rollout_trajectories_per_object = 8
workers = 4

[training]
local_epochs = 100
rollout_epochs_per_horizon = 25
rollout_horizons = [4, 8, 16, 32]
early_stopping_patience = 10
use_bfloat16 = true

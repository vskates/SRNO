seed = 0
device = "cpu"

[paths]
manifest = "../data/simulator-r-v1/manifest.json"
active_index = "../data/simulator-r-v1/active-index.npz"
output_dir = "../runs/ablation-implicit-resolvent-local"

[model]
hidden_dim = 64
operator_layers = 1
contact_features = "gap"
contact_head = "implicit_resolvent"
actuation_conditioning = "drive_error"
pose_predictor = "identity"
pose_corrector = "cone"
pose_update = "decoupled"
resolvent_iterations = 128
resolvent_pose_weight = 100.0
# The QP constrains the geometric SDF boundary.  PhysX contactOffset is used
# only by the exact active/free gate and is not a penetration constraint.
resolvent_constraint_gap_m = 0.0

[loss]
lambda_rotation = 1.0
lambda_joints = 1.0
lambda_feasibility = 1.0
admissible_gap_m = -0.00049232522724196315

[optimizer]
learning_rate = 3e-4
weight_decay = 1e-4
gradient_clip = 1.0
warmup_fraction = 0.05

[loader]
objects_per_batch = 4
local_samples_per_object = 256
rollout_trajectories_per_object = 8
workers = 4

[training]
local_epochs = 40
rollout_epochs_per_horizon = 25
rollout_horizons = [4, 8, 16, 32]
early_stopping_patience = 8
use_bfloat16 = false
